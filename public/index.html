<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="theme-color" content="#eef0f4" />
  <title>ZoraBot</title>
  <script>
    (function () {
      try {
        var t = localStorage.getItem('zora-theme');
        document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div id="app" class="app">

    <div id="view-auth" class="view hidden">
      <div class="auth-shell">
        <div class="auth-card">
          <div class="auth-brand">
            <span class="brand-mark">Zora<span class="brand-accent">Bot</span></span>
            <p class="auth-tagline">WhatsApp Gateway</p>
          </div>

          <div class="auth-tabs" role="tablist">
            <button type="button" class="auth-tab active" data-tab="login">Masuk</button>
            <button type="button" class="auth-tab" data-tab="register">Daftar</button>
          </div>

          <form id="form-login" class="auth-form">
            <div class="field">
              <label for="login-user">Username</label>
              <input id="login-user" type="text" name="username" autocomplete="username" required minlength="3" placeholder="username" />
            </div>
            <div class="field">
              <label for="login-pass">Password</label>
              <input id="login-pass" type="password" name="password" autocomplete="current-password" required minlength="6" placeholder="••••••••" />
            </div>
            <p id="login-error" class="form-error hidden"></p>
            <button type="submit" class="btn btn-primary btn-block">Masuk</button>
          </form>

          <form id="form-register" class="auth-form hidden">
            <div class="field">
              <label for="reg-user">Username</label>
              <input id="reg-user" type="text" name="username" autocomplete="username" required minlength="3" placeholder="minimal 3 karakter" />
            </div>
            <div class="field">
              <label for="reg-pass">Password</label>
              <input id="reg-pass" type="password" name="password" autocomplete="new-password" required minlength="6" placeholder="minimal 6 karakter" />
            </div>
            <p id="register-error" class="form-error hidden"></p>
            <button type="submit" class="btn btn-primary btn-block">Buat Akun</button>
          </form>
        </div>
      </div>
    </div>

    <div id="view-main" class="view hidden">
      <header class="topbar" id="topbar">
        <div class="topbar-inner">
          <a href="/" class="brand-mark sm">Zora<span class="brand-accent">Bot</span></a>
          <div class="topbar-actions">
            <button type="button" id="btn-theme" class="theme-switch" aria-label="Ganti tema">
              <span class="theme-track"><span class="theme-knob"></span></span>
              <span id="theme-label">Dark</span>
            </button>
            <button type="button" id="btn-logout" class="icon-btn" aria-label="Keluar" title="Keluar">
              <i class="fa-solid fa-right-from-bracket"></i>
            </button>
          </div>
        </div>
      </header>

      <main class="page">
        <div class="page-intro">
          <div>
            <p class="eyebrow">Panel kontrol</p>
            <h1 class="page-title">Dashboard</h1>
            <p class="page-desc">Kelola bot WhatsApp dari satu tempat.</p>
          </div>
          <button type="button" id="btn-create-bot" class="btn btn-primary">
            <i class="fa-solid fa-plus"></i>
            <span>Buat Bot</span>
          </button>
        </div>

        <div id="bots-list" class="card-stack"></div>

        <div id="empty-state" class="empty-card hidden">
          <div class="empty-icon"><i class="fa-solid fa-robot"></i></div>
          <h2>Belum ada bot</h2>
          <p>Buat bot pertama untuk mulai menghubungkan nomor WhatsApp.</p>
          <button type="button" id="btn-create-bot-empty" class="btn btn-primary">Buat Bot</button>
        </div>
      </main>
    </div>

    <div id="modal-overlay" class="modal-overlay hidden">
      <div class="modal" id="modal" role="dialog" aria-modal="true">
        <div class="modal-header">
          <h2 id="modal-title">Bot</h2>
          <button type="button" id="modal-close" class="icon-btn" aria-label="Tutup">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
        <div class="modal-body" id="modal-body"></div>
      </div>
    </div>

  </div>
  <script src="/js/app.js" type="module"></script>
</body>
</html>

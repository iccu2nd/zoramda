<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ZoraBot</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
<link rel="stylesheet" href="/css/styles.css" />
<script>
  // Applied immediately, before paint, so there is never a light-mode flash.
  document.documentElement.setAttribute('data-theme', localStorage.getItem('zora-theme') || 'light');
</script>
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card">
      <div class="brand"><span class="mark">Z</span> ZoraBot</div>
      <h1 id="formTitle">Sign in</h1>
      <p class="sub" id="formSub">Manage your WhatsApp bots</p>

      <div class="auth-error" id="authError"></div>

      <form id="authForm">
        <div class="field">
          <label for="username">Username</label>
          <input id="username" name="username" autocomplete="username" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required />
        </div>
        <button class="btn btn-primary btn-block" type="submit" id="submitBtn">Sign in</button>
      </form>

      <div class="auth-switch">
        <span id="switchPrompt">Don't have an account?</span>
        <a id="switchLink">Create one</a>
      </div>
    </div>
  </div>

  <script type="module">
    import { api } from '/js/api.js';

    let mode = 'login';
    const form = document.getElementById('authForm');
    const errorBox = document.getElementById('authError');
    const submitBtn = document.getElementById('submitBtn');

    function setMode(next) {
      mode = next;
      const isLogin = mode === 'login';
      document.getElementById('formTitle').textContent = isLogin ? 'Sign in' : 'Create account';
      document.getElementById('formSub').textContent = isLogin ? 'Manage your WhatsApp bots' : 'Set up your ZoraBot account';
      submitBtn.textContent = isLogin ? 'Sign in' : 'Create account';
      document.getElementById('switchPrompt').textContent = isLogin ? "Don't have an account?" : 'Already have an account?';
      document.getElementById('switchLink').textContent = isLogin ? 'Create one' : 'Sign in';
      errorBox.classList.remove('show');
    }

    document.getElementById('switchLink').addEventListener('click', () => setMode(mode === 'login' ? 'register' : 'login'));

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.classList.remove('show');
      submitBtn.disabled = true;
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      try {
        if (mode === 'register') {
          await api.register({ username, password });
          await api.login({ username, password });
        } else {
          await api.login({ username, password });
        }
        window.location.href = '/dashboard.html';
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.classList.add('show');
      } finally {
        submitBtn.disabled = false;
      }
    });

    // If already signed in, skip straight to the dashboard.
    api.me().then(() => { window.location.href = '/dashboard.html'; }).catch(() => {});
  </script>
</body>
</html>

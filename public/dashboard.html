<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ZoraBot Dashboard</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
<link rel="stylesheet" href="/css/styles.css" />
<script>
  document.documentElement.setAttribute('data-theme', localStorage.getItem('zora-theme') || 'light');
</script>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="mark">Z</span> ZoraBot</div>
    <div class="topbar-actions">
      <button class="btn btn-icon" id="themeToggle" title="Toggle theme"><i class="fa-solid fa-sun"></i></button>
      <button class="btn btn-icon" id="logoutBtn" title="Sign out"><i class="fa-solid fa-arrow-right-from-bracket"></i></button>
    </div>
  </header>

  <div class="shell">
    <aside class="sidebar">
      <div class="sidebar-header">
        <h3>YOUR BOTS</h3>
        <button class="btn btn-icon" id="newBotBtn" title="New bot"><i class="fa-solid fa-plus"></i></button>
      </div>
      <div class="bot-list" id="botList"></div>
    </aside>

    <main class="main" id="main">
      <div class="card empty-state">
        <i class="fa-solid fa-robot"></i>
        <h2>No bot selected</h2>
        <p>Create a bot or pick one from the list to get started.</p>
      </div>
    </main>
  </div>

  <div class="toast" id="toast"></div>

  <script type="module" src="/js/dashboard.js"></script>
</body>
</html>

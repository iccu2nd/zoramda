<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#eef0f4">
  <title>dashboard · zorabot</title>
  <script>
    (function () {
      try {
        var t = localStorage.getItem('zb_theme');
        document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>
  <!-- login -->
  <div id="loginView" class="wrap">
    <div class="login-card">
      <div class="brand" style="justify-content:center;margin-bottom:1rem">zora<span class="brand-box">bot</span></div>
      <h1>masuk dashboard</h1>
      <p class="sub">masukkan api key kamu untuk mengelola session</p>
      <div class="field">
        <label>api key</label>
        <input type="password" id="apiKeyInput" placeholder="zb_..." autocomplete="off">
      </div>
      <button class="btn btn-block" id="loginBtn" type="button">masuk</button>
      <p style="text-align:center;margin-top:1rem;font-size:0.85rem;color:var(--muted);font-weight:500">
        <a href="/" style="font-weight:700">← kembali</a>
      </p>
    </div>
  </div>

  <!-- app -->
  <div id="appView" class="app-shell hidden">
    <div class="side-backdrop" id="sideBackdrop"></div>
    <aside class="sidebar" id="sidebar">
      <a href="/app" class="brand">zora<span class="brand-box">bot</span></a>
      <button class="side-link active" data-page="sessions" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="5" y="2" width="14" height="20" rx="2.5"/><path d="M12 18h.01"/></svg>
        sessions
      </button>
      <button class="side-link" data-page="config" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="3"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        config
      </button>
      <div class="side-foot">
        <button class="side-link" id="themeBtn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          tema
        </button>
        <button class="side-link" id="logoutBtn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
          keluar
        </button>
      </div>
    </aside>

    <main class="main">
      <div class="mobile-bar">
        <button class="icon-btn" id="menuBtn" type="button" aria-label="menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <span class="brand">zora<span class="brand-box">bot</span></span>
      </div>

      <!-- sessions page -->
      <section id="page-sessions">
        <h1 class="page-title">sessions</h1>
        <p class="page-sub">kelola koneksi whatsapp kamu</p>
        <div class="toolbar">
          <button class="btn btn-sm" id="refreshSessions" type="button">refresh</button>
          <div class="spacer"></div>
          <button class="btn btn-sm" id="newSessionBtn" type="button">+ session baru</button>
        </div>
        <div id="sessionList" class="session-grid"></div>
      </section>

      <!-- config page -->
      <section id="page-config" class="hidden">
        <h1 class="page-title">config</h1>
        <p class="page-sub">pengaturan bot — tersimpan di database</p>
        <div class="card" id="configForm" style="padding:1.25rem"></div>
        <div class="toolbar" style="margin-top:1rem">
          <button class="btn" id="saveConfigBtn" type="button">simpan</button>
        </div>
      </section>
    </main>
  </div>

  <!-- modals -->
  <div class="overlay" id="overlay">
    <div class="modal" id="modal">
      <h3 id="modalTitle">judul</h3>
      <p class="modal-sub" id="modalSub"></p>
      <div id="modalBody"></div>
      <div class="modal-actions" id="modalActions"></div>
    </div>
  </div>

  <div class="toast-wrap" id="toasts"></div>

  <script src="/js/theme.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
